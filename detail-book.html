<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Buku</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="detail-page">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h1 class="logo">📚 MyLibrary</h1>
        <a href="index.html" class="menu">
            Home
        </a>

        <a href="dashboard.html" class="menu">
            Dashboard
        </a>

        <a href="add-book.html" class="menu">
            Tambah Buku
        </a>

        <a href="detail-book.html" class="menu active">
            Detail Buku
        </a>

        <a href="about.html" class="menu">
            About
        </a>

        <a href="login.html" class="menu">
            Login
        </a>
        <button class="dark-btn" onclick="toggleDarkMode()">
    🌙 Dark Mode
    </button>
</div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="detail-container">
            <div class="detail-card">
                <h2>Detail Bacaan</h2>
                <hr>
                <div class="detail-item">
                    <span>📖 Judul</span>
                    <input
                        id="detailJudul"
                        type="text"
                        autocomplete="off"
                        readonly
                        class="detail-input view">
                </div>

                <div class="detail-item">
                    <span>🎬 Episode</span>
                    <input
                        id="detailEpisode"
                        type="number"
                        min="1"
                        autocomplete="off"
                        readonly
                        class="detail-input view">
                </div>

                <div class="detail-item">
                    <span>🎭 Genre</span>
                    <input
                        id="detailGenre"
                        type="text"
                        autocomplete="off"
                        readonly
                        class="detail-input view">
                </div>

                <div class="detail-item">
                    <span>🌐 Platform</span>
                    <input
                        id="detailPlatform"
                        type="text"
                        readonly
                        class="detail-input view">
                </div>

                <div class="detail-item">
                    <span>📊 Status Bacaan</span>
                    <select
                        id="detailStatus"
                        disabled
                        class="detail-input view">
                        <option value="Sedang Dibaca">Sedang Dibaca</option>
                        <option value="Selesai">Selesai</option>
                        <option value="Wishlist">Wishlist</option>
                    </select>
                </div>

                <div class="detail-item">
                    <span>📈 Progress</span>
                    <input
                        id="detailProgress"
                        type="number"
                        min="0"
                        max="100"
                        readonly
                        class="detail-input view">
                </div>

                <!-- BUT-->
                <div class="aksi">
                    <button class="btn-edit" onclick="editProgressDetail()">
                        Edit
                    </button>

                    <button class="btn-hapus" onclick="hapusProgressDetail()">
                        Hapus
                    </button>
                </div>
                <a href="dashboard.html" class="btn-kembali">
                    ← Kembali ke Dashboard
                </a>
            </div>
        </div>
    </div>

    <script src="assets/js/script.js"></script>

</body>

</html>
